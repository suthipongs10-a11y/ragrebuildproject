<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
      <div id="unity-links">
        <div style="float: left; padding:10px;">
          <a href="RagnarokRebuild.zip">PC Client</a>
       </div>
       <div style="float: left; padding:10px;">
          <a href="db/MonsterListFull.html" target="_blank">Map/Monster/Item DB</a>
       </div>
      </div>
    </div>

    <div id="unity-diag"></div>

    <script>
      // A console for the machines that do not have one.
      //
      // Safari on a phone cannot be opened to a developer console without a Mac plugged
      // into it, so on an iPhone a crash is a black screen and a sentence, and every
      // theory about why is a guess. This prints what went wrong onto the page itself,
      // and keeps the last of it in localStorage - which matters more than it sounds,
      // because a tab that is killed takes its overlay with it. Reopen with the flag
      // still on and the previous run's last words are the first thing on screen.
      //
      // Off unless ?debug=1 is on the address, and every line of it inside a try, so
      // that the worst this can do to a normal visit is nothing at all.
      (function () {
        try {
          var on = /[?&]debug=1/.test(location.search);
          var box = document.getElementById("unity-diag");
          if (!box) return;

          var KEY = "rrDiag";
          var lines = [];

          function paint() {
            box.textContent = lines.join("\n");
            try { localStorage.setItem(KEY, lines.slice(-40).join("\n")); } catch (e) {}
          }

          window.rrDiag = function (text) {
            if (!on) return;
            lines.push(text);
            if (lines.length > 60) lines.shift();
            paint();
          };

          if (!on) return;

          box.style.cssText = "position:fixed;left:0;right:0;top:0;max-height:45%;"
            + "overflow:auto;z-index:99999;background:rgba(0,0,0,.85);color:#7CFC98;"
            + "font:11px/1.45 monospace;white-space:pre-wrap;padding:6px;"
            + "-webkit-user-select:text;user-select:text";

          var previous = "";
          try { previous = localStorage.getItem(KEY) || ""; } catch (e) {}
          if (previous) lines.push("--- previous run ---", previous, "--- this run ---");

          window.rrDiag("ua: " + navigator.userAgent);
          window.rrDiag("screen: " + screen.width + "x" + screen.height
            + " dpr " + window.devicePixelRatio);

          window.addEventListener("error", function (e) {
            window.rrDiag("ERROR: " + (e.message || e.type)
              + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
          });
          window.addEventListener("unhandledrejection", function (e) {
            window.rrDiag("REJECT: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
          });
        } catch (e) {}
      })();
    </script>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // iPadOS, and any browser asked for the desktop site, report a Macintosh
      // user agent, so touch points are what actually tell a handheld apart.
      var isHandheld = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));

      if (isHandheld) {
        container.className = "unity-mobile";
        // Avoid draining fillrate performance on mobile devices,
        // and default/override low DPI mode on mobile browsers.
        config.devicePixelRatio = 1;
        // Keep the page itself from scrolling or bouncing under the canvas.
        document.documentElement.style.overflow = "hidden";
        document.body.style.overflow = "hidden";
      } else {
        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }
#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // The size of the wasm heap, which is the number an out-of-memory argument
          // turns on. performance.memory is Chrome's and Safari does not have it, but
          // the heap belongs to the build rather than to the browser, so this reads the
          // same everywhere - including on the phone that cannot be plugged into
          // anything. The peak is kept because the last value before a kill is not
          // necessarily the highest one.
          try {
            var peak = 0;
            setInterval(function () {
              try {
                var mb = unityInstance.Module.HEAP8.byteLength / 1048576;
                if (mb > peak) peak = mb;
                if (window.rrDiag) window.rrDiag("heap " + mb.toFixed(0) + " MB (peak " + peak.toFixed(0) + ")");
              } catch (e) {}
            }, 2000);
          } catch (e) {}
        }).catch((message) => {
          if (window.rrDiag) window.rrDiag("LOAD FAILED: " + message);
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
