<title>Summon Jump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one game stage; landscape touch = full-height stage with overlaid controls; portrait = controls below */
:root{
  --bg:#17120c; --panel:#251c13; --panel2:#33271a; --ink:#f6ecd8; --muted:#b9a684;
  --accent:#f0a845; --line:#4a3a26; --good:#8fd08a; --bad:#ff7a6b; --sp:#5fa8ff;
  --f-ui:'Itim',system-ui,sans-serif; --f-px:'Pixelify Sans','Itim',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:10px 16px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-px);font-weight:700;font-size:22px;margin:0;letter-spacing:.03em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.btn{font:inherit;font-size:15px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,.pb:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#2a1a00;border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{font-size:13px;padding:3px 10px}
.btn.warn{color:var(--bad)}
.stage{position:relative;width:min(100%, calc((100dvh - 250px) * 1.7647));min-width:min(100%,300px);margin:0 auto;aspect-ratio:480/272;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
canvas{display:block;width:100%;height:100%}
.menuBtn{position:absolute;top:6px;right:6px;font-size:13px;padding:2px 10px;background:rgba(28,20,12,.75)}
.menuBtn.alert::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.overlay{position:absolute;inset:0;background:rgba(20,14,8,.84);display:flex;align-items:center;justify-content:center;padding:8px}
.overlay[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:720px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--f-px);font-size:20px;margin:0;text-wrap:balance}
.card h3{font-size:14px;margin:0;color:var(--muted);font-weight:400;letter-spacing:.04em}
.card p{margin:0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{font:inherit;font-size:14px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap;cursor:pointer;position:relative}
.tab.on{color:#2a1a00;background:var(--accent);border-color:transparent}
.tab .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.stat{background:var(--panel2);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:8px}
.stat b{font-family:var(--f-px);font-size:17px;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.stat .nm{flex:1;min-width:0}
.stat .nm small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.plus{font:700 16px var(--f-px);width:30px;height:30px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;flex:none}
.plus:disabled{opacity:.3;border-color:var(--line);color:var(--muted);cursor:default}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 12px;font-size:14px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-block:2px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;font-weight:400}
.pts{font-size:14px;color:var(--accent)}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start}
.item.eq{border-color:var(--accent)}
.item .ic{width:36px;height:36px;flex:none;border-radius:8px;background:#1d160e;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .ic img{max-width:34px;max-height:34px}
.item .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .bd small{color:var(--muted);font-size:12px;line-height:1.35}
.slots{display:flex;gap:4px;flex-wrap:wrap}
.slot{font:inherit;font-size:12px;border:1px dashed var(--muted);border-radius:6px;padding:1px 6px;background:transparent;color:var(--muted);cursor:pointer}
.slot.full{border-style:solid;border-color:#c9a6ff;color:#e2d2ff;cursor:default}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.chip{font:inherit;text-align:left;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.chip.on{border-color:var(--accent);background:#47331c}
.chip img{width:34px;height:34px;object-fit:contain;flex:none}
.chip b{display:block;font-weight:400}
.chip small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.tag{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--accent);color:#2a1a00;margin-left:4px}
.quest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.quest li{display:flex;gap:8px;line-height:1.4;font-size:15px}
.quest li i{font-style:normal;width:18px;flex:none;color:var(--muted)}
.quest li.done{color:var(--muted);text-decoration:line-through}
.quest li.done i{color:var(--good)}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cell{border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;min-height:34px;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--muted)}
.cell.void{background:transparent}
.cell.here{background:var(--accent);color:#2a1a00}
.cell.seen{color:var(--ink)}
.note{color:var(--muted);font-size:13px}
/* touch controls */
.pad{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;touch-action:none}
.joy{width:132px;height:132px;border-radius:50%;background:rgba(51,39,26,.55);border:2px solid var(--line);position:relative;flex:none;touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(240,168,69,.85);box-shadow:0 0 0 3px rgba(0,0,0,.25);pointer-events:none}
.joy .hint{position:absolute;inset:0;pointer-events:none;color:var(--muted);font-size:12px}
.joy .hint span{position:absolute;left:50%;transform:translateX(-50%)}
.btns{display:grid;grid-template-columns:repeat(3,auto);grid-template-rows:auto auto;gap:8px;align-items:center;justify-items:center}
.pb{position:relative;width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:rgba(51,39,26,.85);color:var(--ink);font:500 15px var(--f-ui);touch-action:none;padding:0;overflow:hidden;--cd:0}
.pb.big{width:76px;height:76px;font-size:17px}
.pb.jump{border-color:var(--accent);background:rgba(71,51,28,.9)}
.pb img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;opacity:.95;pointer-events:none}
.pb .lb{position:relative;z-index:2;text-shadow:0 1px 2px #000}
.pb::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.65) calc(var(--cd)*1turn),transparent 0);pointer-events:none;z-index:1}
.pb.nosp{filter:grayscale(.8) brightness(.7)}
.pb.held{background:var(--accent);color:#2a1a00}
.pb.ult{--g:0;border-color:#c9a6ff;background:conic-gradient(rgba(201,166,255,.55) calc(var(--g)*1turn),rgba(51,39,26,.85) 0)}
.pb.ult::after{display:none}
.pb.ult.ready{animation:pulse 0.9s ease-in-out infinite;border-color:#fff}
@keyframes pulse{50%{box-shadow:0 0 18px 4px rgba(201,166,255,.85)}}
@media (prefers-reduced-motion:reduce){.pb.ult.ready{animation:none;box-shadow:0 0 12px 3px rgba(201,166,255,.8)}}
.hint-key{color:var(--muted);font-size:14px;text-align:center}
.rotate{display:none;color:var(--muted);font-size:14px;text-align:center}
@media (pointer:fine){.pad{display:none}}
@media (pointer:coarse){.hint-key{display:none}}
@media (pointer:coarse) and (orientation:portrait){.rotate{display:block}}
@media (pointer:coarse) and (orientation:landscape){
  .wrap{padding-block:0;padding-inline:0;max-width:none}
  header,.rotate{display:none}
  .stage{width:min(100%, calc(100dvh * 1.7647));border-radius:0;box-shadow:none}
  .pad{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-inline:calc(16px + env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-right,0px));pointer-events:none}
  .pad .joy,.pad .pb{pointer-events:auto}
  .joy{opacity:.8}
  .pb{opacity:.85}
}
</style>

<div class="wrap">
  <header>
    <h1>Summon <span>Jump</span></h1>
    <div class="sub">เดโม v3: นักดาบ · สกิล · ของสวมใส่ · การ์ด · ภูตหัวหน้า</div>
  </header>
  <div class="stage" id="stage">
    <canvas id="game" aria-label="จอเกม Summon Jump"></canvas>
    <button class="btn menuBtn" id="menuBtn">เมนู</button>
    <div class="overlay" id="over"></div>
  </div>
  <div class="rotate">หมุนมือถือเป็นแนวนอนจะเล่นง่ายขึ้น</div>
  <div class="pad" id="pad">
    <div class="joy" id="joy"><div class="hint"><span style="top:6px">ใช้</span><span style="bottom:6px">ลงท่อ</span></div><div class="knob" id="knob"></div></div>
    <div class="btns">
      <button class="pb" data-k="sk1" id="b_sk1"><img alt="" id="i_sk1"><span class="lb">สกิล 1</span></button>
      <button class="pb" data-k="sk2" id="b_sk2"><img alt="" id="i_sk2"><span class="lb">สกิล 2</span></button>
      <button class="pb ult" data-k="ult" id="b_ult"><img alt="" id="i_ult"><span class="lb">ภูต</span></button>
      <button class="pb big" data-k="atk"><span class="lb">ฟัน</span></button>
      <span></span>
      <button class="pb big jump" data-k="jump"><span class="lb">โดด</span></button>
    </div>
  </div>
  <div class="hint-key">← → เดิน · Space/Z กระโดด (กลางอากาศกดอีกครั้ง = 2 ชั้น) · X ฟัน · C สกิล 1 · V สกิล 2 · F ท่าภูต · ↑ ใช้งาน · ↓ ลงท่อ · M เมนู</div>
</div>
