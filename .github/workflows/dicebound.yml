name: dicebound

on:
  push:
    paths:
      - 'dicebound/**'
      - '.github/workflows/dicebound.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: dicebound

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dicebound/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  build-win:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dicebound/package-lock.json
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: dicebound-win-portable
          path: dicebound/release/*.exe
          if-no-files-found: error
