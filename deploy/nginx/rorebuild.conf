# nginx site for the game server. Copy to /etc/nginx/sites-available/rorebuild.conf,
# replace example.com with the real domain, enable it, then run
#   certbot --nginx -d example.com
# which rewrites this file with the ssl block and the 80 -> 443 redirect.
# deploy/vps-setup.sh does the copy and the rename for you.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # the game socket - long lived, no buffering, headers that make the upgrade happen
    location /ws {
        proxy_pass http://127.0.0.1:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # the browser build, served by the game server itself out of its WebClient folder
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the .data and .wasm files are tens of megabytes
        proxy_read_timeout 600s;
        proxy_max_temp_file_size 0;
    }

    # the item/monster database site in web/, if you put it on the same machine
    # location /db/ {
    #     alias /opt/rorebuild/web/;
    #     index index.html;
    # }
}
