# nginx site for the game. Copy to /etc/nginx/sites-available/rorebuild.conf, replace
# example.com with the real domain, enable it, then get certificates for all three names
# at once:
#   certbot --nginx -d example.com -d www.example.com -d play.example.com
# certbot rewrites this file with the ssl blocks and the 80 -> 443 redirects.
#
# deploy/vps-setup.sh installs this with the domain substituted, and
# deploy/domain-setup.sh does the same later, when a domain is finally registered.
#
# Two names, two jobs:
#   example.com, www.example.com   the front page - what the server is, and whether it
#                                  is up. A folder of files, no game server involved.
#   play.example.com               the game itself, page and socket both.
#
# They are kept apart because the front page has to be readable when the game is not
# running - which is exactly when somebody is most likely to be looking at it. Serving
# it from the game server would mean a stopped server has no page to say so.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --------------------------------------------------------------------------------
# The game. Also the default site, so the bare IP address keeps working the way it
# did before there was a domain - useful while DNS is still propagating, and the only
# way in if the domain ever lapses.
# --------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name play.example.com;

    # the game socket - long lived, no buffering, headers that make the upgrade happen
    location /ws {
        proxy_pass http://127.0.0.1:5000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # the browser build, served by the game server itself out of its WebClient folder
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the .data and .wasm files are tens of megabytes
        proxy_read_timeout 600s;
        proxy_max_temp_file_size 0;
    }
}

# --------------------------------------------------------------------------------
# The front page. Static files only.
# --------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /opt/rorebuild/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The page asks play.example.com how many people are on, every half minute. Nothing
    # about that answer is worth holding on to, and a cached one is wrong by the time it
    # is read, so the page itself is allowed to be cached and the answer is not - which
    # the game server says for itself with no-store on /status.
    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }
}
