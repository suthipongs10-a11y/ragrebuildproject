<title>Eggbound Battle Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed battle canvas; HUD floats in the corners; a mode menu overlays at start. Single dusk-garden look. */
:root{
  --ground:#1d2619;--ink:#f7f0e3;--ink-dim:#cdbfa6;--ink-faint:rgba(247,240,227,.55);
  --panel:rgba(18,22,19,.86);--panel-hi:rgba(255,244,222,.07);--line:rgba(247,240,227,.15);
  --ember:#ff8a2a;--gold:#ffd27a;--hp:#e5483a;--ally:#6fdc72;--atb:#56cfe3;--exp:#c7a7ff;--dark:#0e110e;
  --f-display:"Mitr",system-ui,sans-serif;--f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);z-index:60;font-family:var(--f-display);color:var(--ink-dim)}

/* menu */
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;background:radial-gradient(ellipse at 50% 30%,rgba(60,40,20,.55),rgba(10,12,10,.88));overflow-y:auto}
#menu h1{font-family:var(--f-display);font-weight:600;font-size:clamp(1.7rem,5vw,2.6rem);margin:0;text-align:center;text-shadow:0 2px 0 #4a1d08,0 0 24px rgba(255,140,40,.55);text-wrap:balance}
#menu .sub{color:var(--ink-dim);margin:-12px 0 0;text-align:center;font-size:.92rem;max-width:44ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;width:100%;max-width:720px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-width:0;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--gold)}
.mode .tag{font-size:.7rem;letter-spacing:.18em;color:var(--gold)}
.mode .name{font-family:var(--f-display);font-weight:500;font-size:1.35rem}
.mode ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:.84rem;line-height:1.6}
.mode .go{margin-top:6px;align-self:stretch;text-align:center;background:linear-gradient(180deg,#c9581e,#8f3410);border:1px solid #ffb06a;border-radius:11px;padding:9px;font-weight:600}
.menu-note{font-size:.74rem;color:var(--ink-faint);text-align:center;max-width:52ch;line-height:1.55}

/* top hud */
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;pointer-events:none;z-index:10}
.top>*{pointer-events:auto}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:.8rem}
.tbtn.on{border-color:var(--gold);color:var(--gold)}
.wave{white-space:nowrap;font-family:var(--f-display);font-weight:500;letter-spacing:.12em;font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}

/* turn order */
#order{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;gap:6px;align-items:center;z-index:9;pointer-events:none;background:rgba(0,0,0,.35);padding:5px 8px;border-radius:99px}
#order .o{width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--ally);background:#222;flex:none}
#order .o.e{border-color:var(--hp)}
#order .o.first{width:46px;height:46px;border-color:var(--gold);box-shadow:0 0 10px rgba(255,210,122,.7)}
#order .o img{position:absolute;width:160%;max-width:none;left:-38%;top:-26%}
#order .lbl{font-size:.62rem;color:var(--ink-dim);margin-right:2px}

/* tb skill bar */
#tbBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px}
#tbHint{font-size:.8rem;color:var(--gold);background:rgba(0,0,0,.45);padding:4px 12px;border-radius:99px;text-align:center}
.tbrow{display:flex;gap:10px;align-items:flex-end}
.who{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--ink-dim);max-width:76px;text-align:center}
.who .pic{width:52px;height:52px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--gold);background:#222}
.who .pic img{position:absolute;width:160%;max-width:none;left:-38%;top:-26%}
.sk{position:relative;width:96px;min-height:64px;border-radius:14px;border:1.5px solid rgba(255,210,122,.4);background:linear-gradient(180deg,rgba(60,34,18,.92),rgba(22,14,10,.95));padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;line-height:1.25;text-align:center}
.sk b{font-family:var(--f-display);font-weight:500;font-size:.62rem;color:var(--gold);letter-spacing:.1em}
.sk[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,122,.35),0 0 18px rgba(255,170,60,.35)}
.sk.ult{border-color:rgba(255,120,60,.6)}
.sk:disabled{opacity:.45;cursor:default}
.sk .cdn{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);border-radius:13px;font-family:var(--f-display);font-size:1.4rem;color:#fff}

/* ro hud */
.card{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:7px 12px 7px 7px;min-width:0;max-width:330px}
.card .pic{width:52px;height:52px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--gold);flex:none;background:#2a1a10}
.card .pic img{position:absolute;width:160%;max-width:none;left:-38%;top:-26%}
.card .info{display:grid;gap:4px;min-width:0}
.card .nm{font-family:var(--f-display);font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm small{font-family:var(--f-body);color:var(--ink-dim);font-size:.72rem;margin-left:4px}
.bar{position:relative;height:11px;width:170px;max-width:46vw;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left}
.bar.hp i{background:linear-gradient(90deg,#b8302a,var(--hp))}
.bar.exp i{background:linear-gradient(90deg,#7c5cd6,var(--exp))}
.bar.ahp i{background:linear-gradient(90deg,#3c9a40,var(--ally))}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-size:.58rem;font-weight:600;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.comp{display:flex;gap:8px;align-items:center;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 5px;width:max-content;max-width:100%}
.comp .pic{width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;border:2px solid #7cd0ff;flex:none}
.comp .pic img{position:absolute;width:160%;max-width:none;left:-38%;top:-26%}
.comp .bar{width:110px}
.frags{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:grid;gap:6px;min-width:200px}
.frags h3{margin:0;font-size:.66rem;letter-spacing:.14em;color:var(--gold);font-weight:500}
.frow{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;font-size:.7rem}
.frow img{width:28px;height:28px;object-fit:cover;transform:scale(1.6)}
.frow .bar{width:100%;max-width:none;height:9px}
.frow .bar i{background:linear-gradient(90deg,#a86a1e,var(--gold))}
#roLog{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:9;display:flex;flex-direction:column;gap:2px;font-size:.74rem;max-width:min(320px,55vw);pointer-events:none}
#roLog div{background:rgba(0,0,0,.42);padding:2px 9px;border-radius:7px;width:max-content;max-width:100%;transition:opacity .6s}
#roLog .g{color:#ffe08a}#roLog .x{color:#c7a7ff}
#roSkills{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:10;display:flex;gap:12px;align-items:flex-end}
.rsk{position:relative;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,210,122,.65);background:radial-gradient(circle at 50% 35%,#5b2b16,#1e100a 75%);display:grid;place-items:center;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.5);overflow:visible;touch-action:manipulation}
.rsk.big{width:76px;height:76px;border-color:var(--gold)}
.rsk svg{width:32px;height:32px;filter:drop-shadow(0 0 6px rgba(255,150,50,.8))}
.rsk kbd{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font:600 .58rem var(--f-body);background:rgba(0,0,0,.6);border-radius:5px;padding:0 5px;color:var(--ink-dim)}
.rsk .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.rsk span.l{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:.64rem;white-space:nowrap;color:var(--ink-dim);text-shadow:0 1px 2px #000}

/* banners */
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,0);text-align:center;pointer-events:none;z-index:15;opacity:0;transition:opacity .3s,transform .3s;width:max-content;max-width:92vw}
#banner.show{opacity:1;transform:translate(-50%,-6px)}
#banner .t{font-family:var(--f-display);font-weight:600;font-size:clamp(1.7rem,6vw,3rem);text-shadow:0 2px 0 #4a1d08,0 0 24px rgba(255,140,40,.7)}
#banner .s{font-size:.9rem;color:var(--ink-dim)}
#actName{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);z-index:11;pointer-events:none;font-size:.85rem;background:rgba(0,0,0,.5);border:1px solid var(--line);padding:4px 14px;border-radius:99px;opacity:0;transition:opacity .25s;white-space:nowrap}
#actName.show{opacity:1}
#cutin{--c:#d9481c;position:fixed;left:-10%;right:-10%;top:44%;height:100px;transform:translateY(-50%) skewY(-6deg);pointer-events:none;z-index:14;display:flex;align-items:center;justify-content:center;gap:14px;opacity:0;overflow:hidden}
#cutin::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 55%,#000) 18%,var(--c) 50%,color-mix(in srgb,var(--c) 55%,#000) 82%,transparent);opacity:.92}
#cutin img{position:relative;height:150%;transform:skewY(6deg)}
#cutin span{position:relative;font-family:var(--f-display);font-weight:600;font-size:clamp(1.4rem,4.6vw,2.4rem);letter-spacing:.05em;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.6),0 2px 0 rgba(0,0,0,.4)}
#cutin.go{animation:cut 1.05s ease-out both}
@keyframes cut{0%{opacity:0;clip-path:inset(0 100% 0 0)}15%{opacity:1;clip-path:inset(0 0 0 0)}80%{opacity:1}100%{opacity:0;clip-path:inset(0 0 0 100%)}}

/* result */
#result{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,8,6,.55);padding:16px}
.res{background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:22px 20px 18px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.res h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:2rem;color:var(--gold);text-shadow:0 0 18px rgba(255,190,80,.6)}
.res .items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.res .it{background:var(--panel-hi);border:1px solid var(--line);border-radius:12px;padding:8px 4px;font-size:.72rem;color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;gap:3px}
.res .it .ico{width:44px;height:44px;overflow:hidden;display:grid;place-items:center}
.res .it .ico img{width:44px;height:44px;object-fit:cover;transform:scale(1.7)}
.res .it strong{color:var(--ink);font-size:.8rem}
.res .row{display:flex;gap:8px;width:100%}
.res .row button{flex:1;border-radius:11px;padding:9px;border:1px solid var(--line);background:var(--panel-hi)}
.res .row button.p{background:linear-gradient(180deg,#c9581e,#8f3410);border-color:#ffb06a;font-weight:600}
.proto{font-size:.64rem;letter-spacing:.08em;color:var(--gold);border:1px dashed rgba(255,210,122,.5);padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.35)}

@media (max-width:760px){
  .top{padding-left:10px;padding-right:10px}
  .card{padding:5px 9px 5px 5px}.card .pic{width:42px;height:42px}.bar{width:120px}
  .sk{width:86px;font-size:.7rem}
  .who{display:none}
  .frags{min-width:150px}
  #roLog{display:none}
  .proto{display:none}
  .rsk{width:58px;height:58px}.rsk.big{width:68px;height:68px}
  #order .o{width:28px;height:28px}#order .o.first{width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){#cutin.go{animation-duration:.01s}}
</style>

<canvas id="game" aria-label="ฉากต่อสู้ Eggbound"></canvas>
<div id="loading">กำลังโหลด…</div>

<div id="menu">
  <h1>Eggbound Battle Lab</h1>
  <p class="sub">ลองระบบต่อสู้ 2 แบบด้วยมอน เอฟเฟ็ค และสกิลชุดเดียวกัน แล้วตัดสินใจว่าแบบไหนสนุกกว่า</p>
  <div class="modes">
    <button class="mode" id="goTB" type="button">
      <span class="tag">แบบ SUMMONERS WAR</span>
      <span class="name">เทิร์นเบส 3 ต่อ 3</span>
      <ul><li>เกจลำดับเทิร์นตามความเร็ว</li><li>เลือกสกิล 3 ช่อง แล้วแตะเป้าหมาย</li><li>สกิลสุดยอดมีฉากตัดภาพ</li><li>2 เวฟ เวฟสุดท้ายเป็นบอส · มีโหมด AUTO และ x2 x3</li></ul>
      <span class="go">เริ่มเทิร์นเบส</span>
    </button>
    <button class="mode" id="goRO" type="button">
      <span class="tag">แบบ RAGNAROK ONLINE</span>
      <span class="name">เดินตีเรียลไทม์</span>
      <ul><li>แตะศัตรูเพื่อเดินไปตีอัตโนมัติ</li><li>มอนผู้ช่วยตามมาช่วยตีและฮีล</li><li>มอนป่าเดินเพ่นพ่าน บางตัวเข้ามาตีเอง</li><li>ดรอปเศษไข่ เก็บเลเวล</li></ul>
      <span class="go">เริ่มเดินตี</span>
    </button>
  </div>
  <p class="menu-note">มอนธาตุอื่นในเดโมนี้เป็นจิ้งจอกตัวเดิมที่เปลี่ยนสีด้วยโค้ดชั่วคราว (จิ้งจอกลมและจิ้งจอกแสงมีอยู่ในรายชื่อมอนจริง) และตอนนี้ยังใช้ท่ายืนแทนท่าเดิน</p>
</div>

<header class="top">
  <div id="topLeft"></div>
  <div class="tbtns">
    <span class="proto">PROTOTYPE</span>
    <button class="tbtn" id="autoBtn" type="button" hidden>AUTO: ปิด</button>
    <button class="tbtn" id="spdBtn" type="button" hidden>ความเร็ว x1</button>
    <button class="tbtn" id="muteBtn" type="button">เสียง: เปิด</button>
    <button class="tbtn" id="menuBtn" type="button">เลือกโหมด</button>
  </div>
</header>
<div id="order" hidden></div>
<div id="actName"></div>
<div id="tbBar" hidden>
  <div id="tbHint">แตะศัตรูเพื่อโจมตี</div>
  <div class="tbrow">
    <div class="who"><div class="pic"><img id="whoImg" alt=""></div><span id="whoName"></span></div>
    <button class="sk" id="tbS0" type="button"></button>
    <button class="sk" id="tbS1" type="button"></button>
    <button class="sk ult" id="tbS2" type="button"></button>
  </div>
</div>
<div id="roLog" hidden></div>
<div id="roSkills" hidden>
  <button class="rsk" id="rs1" type="button" aria-label="โจมตี"><svg viewBox="0 0 40 40" fill="none" stroke="#ffe2b8" stroke-width="3.4" stroke-linecap="round"><path d="M10 30 L18 8"/><path d="M17 32 L25 10"/><path d="M24 33 L31 14"/></svg><kbd>1</kbd><i class="cd"></i><span class="l">โจมตี</span></button>
  <button class="rsk" id="rs2" type="button" aria-label="ลูกไฟจิ้งจอก"><svg viewBox="0 0 40 40"><path d="M6 30 C12 26 14 20 22 18" stroke="#ffb46a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="26" cy="15" r="8" fill="#ffd28a"/><circle cx="26" cy="15" r="4" fill="#fff6e0"/></svg><kbd>2</kbd><i class="cd"></i><span class="l">ลูกไฟ</span></button>
  <button class="rsk big" id="rs3" type="button" aria-label="อรุณเพลิงทะยาน"><svg viewBox="0 0 40 40"><path d="M20 3 C24 11 31 14 30 24 C30 31 25 36 20 36 C14 36 10 31 10 25 C10 19 14 17 15 11 C18 15 18 18 20 19 C21 14 19 8 20 3Z" fill="#ffb24e"/><path d="M20 18 C23 22 25 25 24 29 C23 32 21 33 20 33 C18 33 16 31 16 28 C16 25 19 23 20 18Z" fill="#fff1c9"/></svg><kbd>3</kbd><i class="cd"></i><span class="l">Burst</span></button>
</div>
<div id="banner"><div class="t" id="bT"></div><div class="s" id="bS"></div></div>
<div id="cutin"><img id="cutImg" alt=""><span id="cutText"></span></div>
<div id="result" hidden><div class="res"><h2 id="resT">ชนะ!</h2><p id="resS" class="sub" style="margin:0;color:var(--ink-dim)"></p><div class="items" id="resItems"></div><div class="row"><button class="p" id="resAgain" type="button">เล่นอีกครั้ง</button><button id="resMenu" type="button">เลือกโหมด</button></div></div></div>

<script>
const ASSET=/*ASSET*/;
(async function(){
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#game'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2,SQ=.6;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-t,3),easeIn=t=>t*t*t,easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,easeBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

/* ---------- assets ---------- */
const POSES=['idle','attack','cast','hit','burst'];
const IMG={};
await Promise.all(Object.keys(ASSET).map(n=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{IMG[n]=i;res()};i.onerror=()=>rej(n);i.src=ASSET[n]})));
try{await Promise.race([document.fonts.load('600 20px Mitr'),new Promise(r=>setTimeout(r,2000))])}catch(e){}
$('#loading').hidden=true;
const PIV=[256,435];
const ANCH_RAW={front_idle:{mouth:[735,640],body:[520,640]},front_attack:{mouth:[750,690],body:[480,600]},front_cast:{mouth:[712,430],body:[560,600]},front_hit:{mouth:[740,526],body:[480,640]},front_burst:{mouth:[776,756],body:[560,700]},back_idle:{mouth:[840,420],body:[480,600]},back_attack:{mouth:[850,360],body:[560,560]},back_cast:{mouth:[800,400],body:[520,600]},back_hit:{mouth:[850,350],body:[480,640]},back_burst:{mouth:[870,500],body:[540,640]}};
const ANCH={};for(const k in ANCH_RAW){ANCH[k]={};for(const p in ANCH_RAW[k]){const a=ANCH_RAW[k][p];ANCH[k][p]=[a[0]/2-PIV[0],a[1]/2-PIV[1]]}}

/* ---------- elements ---------- */
const ELEM={

      case'streak':{ctx.globalAlpha=a;ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X-p.vx*.04,Y+p.vz*.04);ctx.stroke();break}
      case'beam':{const w=p.size*(1-u*.6);const g=ctx.createLinearGradient(X-w,0,X+w,0);g.addColorStop(0,p.color+'00');g.addColorStop(.5,'#fff7e0');g.addColorStop(1,p.color+'00');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(X-w,Y-700,w*2,700);break}
      case'arrow':{ctx.globalAlpha=a;ctx.fillStyle=p.color;const s=sz;ctx.beginPath();ctx.moveTo(X,Y-s);ctx.lineTo(X+s*.8,Y);ctx.lineTo(X+s*.3,Y);ctx.lineTo(X+s*.3,Y+s);ctx.lineTo(X-s*.3,Y+s);ctx.lineTo(X-s*.3,Y);ctx.lineTo(X-s*.8,Y);ctx.closePath();ctx.fill();break}
      case'text':{ctx.globalCompositeOperation='source-over';const pop=u<.15?easeBack(u/.15):1;ctx.globalAlpha=Math.min(1,(1-u)*2.2);ctx.save();ctx.translate(X,Y);ctx.scale(pop,pop);ctx.font=`600 ${p.size}px Mitr, sans-serif`;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(30,10,4,.85)';ctx.strokeText(p.str,0,0);ctx.fillStyle=p.color;ctx.fillText(p.str,0,0);ctx.restore();break}
    }}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
function drawFlies(){ctx.save();ctx.globalCompositeOperation='lighter';for(const f of flies){const x=f.x+Math.sin(G.time*f.sp+f.ph)*40,y=f.y+Math.cos(G.time*f.sp*.8+f.ph)*24-40;ctx.globalAlpha=.3+.3*Math.sin(G.time*2+f.ph*3);ctx.drawImage(dot('#ffe9a8'),x-7,y-7,14,14)}ctx.restore()}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#2c3d22';ctx.fillRect(0,0,W,H);
  const shx=G.shake?rnd(-G.shake,G.shake):0,shy=G.shake?rnd(-G.shake,G.shake):0,z=Z();
  const wt=()=>ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(W/2-cam.x*z+shx),DPR*(H/2-cam.y*z+shy));wt();
  ctx.drawImage(ground,-GOX,-GOY);drawDecals();
  const U=units();for(const u of U)drawUnitGround(u);drawSelGround();
  const ents=[];for(const u of U)ents.push({y:u.y,u});for(const L of LANTERNS)ents.push({y:L.y,d:()=>drawLantern(L)});for(const b of BUSHES)ents.push({y:b.y,d:()=>drawBush(b)});if(G.mode==='ro')for(const d of RO.drops)ents.push({y:d.y,d:()=>drawDrop(d)});
  ents.sort((a,b)=>a.y-b.y);const dimOn=G.dim>.02;
  for(const e of ents){if(e.u){if(dimOn&&G.focus.includes(e.u))continue;drawUnit(e.u)}else e.d()}
  if(dimOn){ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=`rgba(8,6,14,${G.dim})`;ctx.fillRect(0,0,W,H);ctx.restore();for(const u of G.focus)drawUnit(u)}
  drawProjs();drawParts();drawFlies();
  // world ui
  if(G.mode==='tb'){for(const u of U)drawBars(u,{atb:true});const a=TB.active;if(a&&!a.dead){const y=headY(a)-34+Math.sin(G.time*6)*4;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.moveTo(a.x-9,y-10);ctx.lineTo(a.x+9,y-10);ctx.lineTo(a.x,y);ctx.closePath();ctx.fill()}}
  else if(G.mode==='ro'){for(const e of RO.en){if(e.dead||e.alpha<.5)continue;drawBars(e,{name:e.name+' Lv.'+e.lvl,nameColor:e.aggressive?'#ffb4a8':'#ffffff',hideBar:!(e.hp<e.max||RO.target===e)})}drawBars(RO.c,{hideBar:RO.c.hp>=RO.c.max})}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(vign,0,0,W,H);
  if(G.mode==='tb'){const b=TB.units.find(u=>u.boss&&!u.dead);if(b){const w=Math.min(420,W-40),x=(W-w)/2,y=H-(TB.phase==='choose'?190:70);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-2,y-2,w+4,14);ctx.fillStyle='#f3e6c8';ctx.fillRect(x,y,w*b.shown/b.max,10);ctx.fillStyle='#a04ae8';ctx.fillRect(x,y,w*b.hp/b.max,10);ctx.font='500 13px Mitr, sans-serif';ctx.textAlign='center';ctx.fillStyle='#ead0ff';ctx.fillText('ราชันจิ้งจอกราตรี  ★★★★★',W/2,y-6)}}
  if(G.flash>0){ctx.globalAlpha=Math.min(1,G.flash);ctx.fillStyle=G.flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{audioInit();if(!G.mode)return;const [wx,wy]=toWorld(e.clientX,e.clientY);if(G.mode==='tb')tbTap(wx,wy);else roTap(wx,wy)});
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&(e.code==='Space'||e.code==='Enter'))return;audioInit();keys[e.code]=true;if(e.repeat)return;
  const n=e.code==='Digit1'?0:e.code==='Digit2'?1:e.code==='Digit3'?2:-1;
  if(G.mode==='tb'&&n>=0)tbSkillBtn(n);
  if(G.mode==='ro'){if(n===0||e.code==='KeyJ')roAttackBtn();if(n===1||e.code==='KeyK')roFire();if(n===2||e.code==='KeyL')roBurst()}
  if(e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
for(let i=0;i<3;i++)$('#tbS'+i).onclick=()=>{audioInit();tbSkillBtn(i)};
$('#rs1').onclick=()=>{audioInit();roAttackBtn()};$('#rs2').onclick=()=>{audioInit();roFire()};$('#rs3').onclick=()=>{audioInit();roBurst()};
$('#goTB').onclick=()=>{audioInit();tbStart()};$('#goRO').onclick=()=>{audioInit();roStart()};
$('#menuBtn').onclick=()=>toMenu();
$('#resAgain').onclick=()=>{G.mode==='tb'?tbStart():roStart()};$('#resMenu').onclick=()=>toMenu();
$('#autoBtn').onclick=()=>{TB.auto=!TB.auto;$('#autoBtn').textContent='AUTO: '+(TB.auto?'เปิด':'ปิด');$('#autoBtn').classList.toggle('on',TB.auto);if(TB.auto&&TB.phase==='choose'){const u=TB.active;TB.phase='acting';hideSkills();run(function*(){const [si,tg]=aiChoose(u);yield* doSkill(u,si,tg);if(u.status.atkUp){u.status.atkUp--;if(!u.status.atkUp)delete u.status.atkUp}endTurn()}())}};
$('#spdBtn').onclick=()=>{TB.speed=TB.speed>=3?1:TB.speed+1;$('#spdBtn').textContent='ความเร็ว x'+TB.speed;$('#spdBtn').classList.toggle('on',TB.speed>1)};
$('#muteBtn').onclick=()=>{audioInit();AU.on=!AU.on;$('#muteBtn').textContent='เสียง: '+(AU.on?'เปิด':'ปิด')};
window.__eb={tbStart,roStart,TB,RO,G};
requestAnimationFrame(frame);
})().catch(err=>{const l=document.getElementById('loading');l.hidden=false;l.textContent='โหลดไม่สำเร็จ: '+err;console.error(err)});
</script>
