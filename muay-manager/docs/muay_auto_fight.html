<title>Muay Thai Auto Fight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,700;1,800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: fight-night broadcast. Scoreboard strip, arena canvas, call line, tale of the tape. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#0e0f14; --panel:#181a22; --line:#2a2d39; --fg:#f1f2f5; --muted:#9a9fb0;
  --red:#e2382f; --blue:#2f76ea; --gold:#f2b83a; --hp:#49d17d;
  --display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:12px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;margin:0;letter-spacing:.02em;line-height:1.15}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.side{min-width:0;display:flex;flex-direction:column;gap:3px}
.side.b{text-align:right}
.nm{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.r .nm{color:#ff7a70} .side.b .nm{color:#7fb0ff}
.bar{height:11px;background:#2a2d39;border-radius:3px;overflow:hidden;display:flex}
.side.b .bar{justify-content:flex-end}
.bar i{display:block;height:100%;background:var(--hp);transition:width .12s linear}
.bar.st{height:5px} .bar.st i{background:#59b5ff}
.bar.sp{height:4px} .bar.sp i{background:var(--gold)}
.clock{font-family:var(--display);text-align:center;line-height:1.1;padding:0 4px}
.clock .rd{font-size:11px;color:var(--gold);letter-spacing:.1em}
.clock .tm{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);line-height:0;background:#07080b}
canvas{display:block;width:100%}
.result{position:absolute;inset:0;background:rgba(6,7,10,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;line-height:1.35;text-align:center;padding:14px}
.result .w{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px}
.result .m{color:var(--gold);font-family:var(--display);font-size:16px}
.call{min-height:24px;font-size:14px;color:var(--muted)}
.call b{color:var(--fg);font-weight:600}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:var(--display);font-weight:500;font-size:14px}
.btn.go{background:var(--gold);border-color:var(--gold);color:#1b1300;font-weight:700}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.tape{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card h2{font-family:var(--display);font-size:14px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.r h2{color:#ff7a70} .card.b h2{color:#7fb0ff}
.card .sty{font-size:12px;color:var(--muted)}
.stat{display:grid;grid-template-columns:54px minmax(0,1fr) 24px;gap:6px;align-items:center;font-size:12px}
.stat .t{height:5px;background:#2a2d39;border-radius:3px;overflow:hidden}
.stat .t i{display:block;height:100%}
.card.r .t i{background:var(--red)} .card.b .t i{background:var(--blue)}
.stat .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.card .spx{font-size:12px;color:var(--gold)}
.note{font-size:12.5px;color:var(--muted);margin:0}
</style>

<div class="app">
  <header>
    <h1>MUAY THAI <span>AUTO FIGHT</span></h1>
    <p class="sub">เดโมฉากต่อสู้: นักมวยสู้กันเองตามค่าพลัง คุณเป็นคนดู</p>
  </header>

  <div class="board">
    <div class="side r">
      <div class="nm" id="nmR"></div>
      <div class="bar"><i id="hpR" style="width:100%"></i></div>
      <div class="bar st"><i id="stR" style="width:100%"></i></div>
      <div class="bar sp"><i id="spR" style="width:0%"></i></div>
    </div>
    <div class="clock"><div class="rd" id="rd">ยก 1</div><div class="tm" id="tm">0:35</div></div>
    <div class="side b">
      <div class="nm" id="nmB"></div>
      <div class="bar"><i id="hpB" style="width:100%"></i></div>
      <div class="bar st"><i id="stB" style="width:100%"></i></div>
      <div class="bar sp"><i id="spB" style="width:0%"></i></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="result" id="result" hidden>
      <div class="m" id="resM"></div>
      <div class="w" id="resW"></div>
      <div id="resD" style="font-size:13px;color:#c9ccd6"></div>
    </div>
  </div>

  <div class="call" id="call" aria-live="polite"></div>

  <div class="ctrl">
    <button class="btn go" id="btnRematch">ชกใหม่</button>
    <button class="btn" id="btnNew">สุ่มคู่ใหม่</button>
    <button class="btn" id="btnSpeed" aria-pressed="false">เร็ว ×2</button>
    <button class="btn" id="btnSound" aria-pressed="false">เปิดเสียง</button>
  </div>

  <div class="tape">
    <div class="card r" id="cardR"></div>
    <div class="card b" id="cardB"></div>
  </div>
  <p class="note">แถบเขียวคือพลังชีวิต แถบฟ้าคือความอึด แถบทองคือเกจท่าไม้ตาย ชก 3 ยก ยกละ 35 วินาที ล้ม 3 ครั้งแพ้ทีเคโอ ถ้าครบยกตัดสินด้วยคะแนน</p>
</div>

<script>
(function(){
"use strict";
/* ---------- skeleton and poses (local coords: x forward, y up) ---------- */
const L={thigh:44,shin:44,torso:58,neck:9,head:14,ua:30,fa:30};
const BASE={hx:0,hy:78,lean:.14,head:0,fhx:26,fhy:14,bhx:14,bhy:8,ffx:22,ffy:0,bfx:-22,bfy:0,fe:-1,be:-1,jump:0};
const P=o=>Object.assign({},BASE,o);
const POSE={
  guard:P({}),
  wai:P({lean:.4,hy:74,fhx:13,fhy:-8,bhx:13,bhy:-8,ffx:9,bfx:-9,head:.35}),
  jabW:P({fhx:20,fhy:12,lean:.1}),
  jab:P({hx:8,lean:.26,fhx:58,fhy:10,bhx:12,bhy:10}),
  crossW:P({bhx:6,bhy:6,lean:.08,hx:-2}),
  cross:P({hx:14,lean:.4,bhx:59,bhy:6,fhx:14,fhy:12,bfx:-26,bfy:4}),
  elbowW:P({hx:8,lean:.2,bhx:4,bhy:14,be:1}),
  elbow:P({hx:22,lean:.44,bhx:24,bhy:6,be:1,fhx:18,fhy:4,ffx:30}),
  kneeW:P({hx:10,lean:.1,fhx:36,fhy:16,bhx:34,bhy:12,bfx:-10,bfy:10}),
  knee:P({hx:20,hy:84,lean:-.18,fhx:30,fhy:2,bhx:28,bhy:-2,bfx:34,bfy:44,ffx:20}),
  kickW:P({hx:4,lean:0,bfx:-6,bfy:18,bhx:20,bhy:10}),
  kickBody:P({hx:8,hy:82,lean:-.32,bfx:84,bfy:78,bhx:-16,bhy:-22,fhx:20,fhy:16,ffx:14}),
  kickHigh:P({hx:6,hy:84,lean:-.5,bfx:76,bfy:128,bhx:-20,bhy:-26,fhx:18,fhy:14,ffx:12}),
  kickLow:P({hx:8,hy:76,lean:-.12,bfx:80,bfy:26,bhx:-10,bhy:-14,ffx:14}),
  teepW:P({hx:-4,lean:-.05,ffx:20,ffy:34}),
  teep:P({hx:-2,hy:80,lean:-.3,ffx:86,ffy:66,fhx:16,fhy:10,bhx:10,bhy:6}),
  block:P({lean:.2,hy:76,fhx:16,fhy:18,bhx:12,bhy:14}),
  check:P({lean:.05,ffx:18,ffy:34,fhx:18,fhy:14,hx:-4}),
  dodge:P({hx:-12,lean:-.4,head:-.2,fhx:20,fhy:8}),
  hitHead:P({hx:-10,lean:-.42,head:-.6,fhx:12,fhy:-6,bhx:4,bhy:-10}),
  hitBody:P({hx:-8,hy:72,lean:.55,head:.3,fhx:8,fhy:-14,bhx:6,bhy:-12}),
  hitLeg:P({hx:-6,hy:70,lean:.3,ffx:10,ffy:8}),
  fall1:P({hx:-30,hy:50,lean:-1.0,head:-.5,fhx:-10,fhy:10,bhx:-20,bhy:0,ffx:10,ffy:20,bfx:-30}),
  down:P({hx:-60,hy:14,lean:-1.52,head:-.1,fhx:-10,fhy:20,bhx:-24,bhy:6,ffx:20,ffy:6,bfx:0,bfy:4}),
  getup:P({hx:-30,hy:44,lean:.6,fhx:20,fhy:-30,bhx:10,bhy:-30,ffx:10,bfx:-40}),
  win:P({lean:0,hy:80,fhx:8,fhy:54,bhx:-8,bhy:54,fe:1,be:1,ffx:14,bfx:-14}),
  flyW:P({hy:64,lean:.3,fhx:30,fhy:10,bhx:26,bhy:8}),
  fly:P({hx:30,hy:92,jump:36,lean:-.1,bfx:42,bfy:52,ffx:0,ffy:22,fhx:34,fhy:6,bhx:30,bhy:0})
};
const MOVES={
  jab:{th:'หมัดแย็บ',kind:'punch',lvl:'head',reach:104,min:60,dmg:5,st:3,fr:[['jabW',.07],['jab',.07],['guard',.14]],push:4},
  cross:{th:'หมัดตรง',kind:'punch',lvl:'head',reach:104,min:60,dmg:10,st:5,fr:[['crossW',.1],['cross',.09],['guard',.2]],push:8},
  elbow:{th:'ศอก',kind:'punch',lvl:'head',reach:84,min:42,dmg:14,st:6,fr:[['elbowW',.11],['elbow',.08],['guard',.22]],push:6},
  knee:{th:'เข่า',kind:'kick',lvl:'body',reach:78,min:42,dmg:12,st:6,fr:[['kneeW',.12],['knee',.1],['guard',.24]],push:8},
  body:{th:'เตะลำตัว',kind:'kick',lvl:'body',reach:104,min:74,dmg:12,st:7,fr:[['kickW',.13],['kickBody',.1],['kickW',.1],['guard',.16]],push:10},
  high:{th:'เตะก้านคอ',kind:'kick',lvl:'head',reach:100,min:76,dmg:17,st:9,fr:[['kickW',.15],['kickHigh',.11],['kickW',.12],['guard',.18]],push:10},
  low:{th:'เตะขา',kind:'kick',lvl:'leg',reach:104,min:74,dmg:8,st:5,fr:[['kickW',.11],['kickLow',.09],['kickW',.09],['guard',.14]],push:3},
  teep:{th:'ถีบ',kind:'kick',lvl:'body',reach:106,min:80,dmg:6,st:4,fr:[['teepW',.11],['teep',.09],['guard',.2]],push:26},
  spFly:{th:'เข่าลอย',kind:'kick',lvl:'head',reach:122,min:60,dmg:26,st:12,special:1,lunge:34,fr:[['flyW',.2],['fly',.16],['guard',.3]],push:16},
  spKick:{th:'เตะก้านคอสายฟ้า',kind:'kick',lvl:'head',reach:102,min:74,dmg:26,st:12,special:1,fr:[['kickW',.2],['kickHigh',.09],['kickW',.14],['guard',.2]],push:16},
  spElbow:{th:'ศอกสับ',kind:'punch',lvl:'head',reach:96,min:42,dmg:25,st:12,special:1,lunge:16,fr:[['elbowW',.2],['elbow',.07],['guard',.26]],push:12}
};
const STYLES=[
  {th:'หมัดหนัก',w:{jab:3.2,cross:3.2,elbow:2,knee:1,body:1.4,high:.6,low:1.4,teep:.8},sp:'spElbow',b:{pow:22,kick:-8,spd:0,def:-4,end:4}},
  {th:'จอมเตะ',w:{jab:2,cross:1.2,elbow:.8,knee:1.2,body:3.4,high:1.6,low:2.4,teep:1.8},sp:'spKick',b:{pow:-8,kick:22,spd:4,def:0,end:-2}},
  {th:'เข่าศอก',w:{jab:2,cross:1.6,elbow:2.6,knee:3.2,body:1.6,high:.6,low:1.2,teep:1},sp:'spFly',b:{pow:8,kick:10,spd:-4,def:2,end:10}},
  {th:'ฝีมือ',w:{jab:3,cross:1.8,elbow:1.2,knee:1.2,body:2.2,high:1,low:1.8,teep:2.4},sp:'spKick',b:{pow:-4,kick:2,spd:14,def:16,end:0}}
];
const FIRST=['สิงห์แดง','พายุฟ้า','เพชรดำ','เสือสมิง','ฟ้าลั่น','ขุนศึก','ยอดเหล็ก','ศรเพชร','เดชฤทธิ์','ก้องหล้า','ทองแท้','น้ำเพชร'];
const CAMP=['ศ.เหล็กไหล','ลูกแม่มูล','ส.ฟ้าคะนอง','ค่ายพยัคฆ์','ว.ศรีทอง','เกียรติลำน้ำ','ศิษย์ครูเฒ่า'];
const STAT_TH={pow:'หมัดศอก',kick:'เตะเข่า',spd:'ความเร็ว',def:'ป้องกัน',end:'ความอึด'};
const WORLD_W=460, WORLD_H=330, FLOOR=250, ROUND_T=35, ROUNDS=3, LEFT=64, RIGHT=396;
const DMG=0.25;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];

function makeFighter(side, spec){
  return {side:side, dir:side==='r'?1:-1, x:side==='r'?150:310, name:spec.name, style:spec.style, stats:spec.stats,
    hp:100, st:100, sp:0, kd:0, pts:0, state:'intro', t:0, cool:rnd(.4,.9), plan:null, planT:0,
    pose:P({}), from:P({}), to:POSE.guard, pt:0, pd:.001, q:[], qi:0, mv:null, hold:0, phase:rnd(0,6), inv:0, lungeLeft:0, j:null};
}
function randomSpec(used){
  let nm; do{ nm=pick(FIRST); }while(used && used.indexOf(nm)>=0);
  const style=pick(STYLES), stats={};
  Object.keys(STAT_TH).forEach(k=>{ stats[k]=Math.round(clamp(rnd(48,72)+style.b[k],30,98)); });
  return {name:nm+' '+pick(CAMP), first:nm, style:style, stats:stats};
}

/* ---------- game state ---------- */
let G=null, specs=null;
function newFight(fresh){
  if(fresh||!specs){ const a=randomSpec(); specs=[a, randomSpec([a.first])]; }
  G={f:[makeFighter('r',specs[0]), makeFighter('b',specs[1])], phase:'intro', t:0, round:1, clock:ROUND_T,
     count:null, fx:[], pops:[], shake:0, stop:0, slow:0, zoom:1, camX:230, hype:0, flash:0, over:null, events:[], koT:0};
  G.f.forEach(f=>setPose(f,'wai',.5));
  say('ไหว้ครูก่อนชก <b>'+specs[0].name+'</b> พบ <b>'+specs[1].name+'</b>');
  renderCards(); $('result').hidden=true;
}
function setPose(f,name,d){ f.from=Object.assign({},f.pose); f.to=POSE[name]; f.pt=0; f.pd=Math.max(.001,d); }
function speedOf(f){ return (0.82+f.stats.spd/100*0.42)*(f.st<25?0.82:1); }
function startMove(f,key){
  const m=MOVES[key]; f.mv=m; f.q=m.fr; f.qi=0; f.state='move'; f.plan=null;
  f.st=Math.max(0,f.st-m.st); if(m.special){ f.sp=0; G.slow=Math.max(G.slow,.55); pop(m.th+'!', f.x, FLOOR-190, '#f2b83a', 1.25); say('ท่าไม้ตาย! <b>'+f.name+'</b> ออก<b>'+m.th+'</b>'); }
  f.lungeLeft=m.lunge||0;
  setPose(f, m.fr[0][0], m.fr[0][1]/speedOf(f));
}
function choose(f,o){
  if(f.sp>=100 && f.st>14) return f.style.sp;
  const w=f.style.w, keys=Object.keys(w); let tot=0; const ws=keys.map(k=>{
    let v=w[k]; if(f.st<30 && MOVES[k].st>5) v*=.35; if(o.hp<30 && (k==='high'||k==='elbow'||k==='knee')) v*=1.6; tot+=v; return v; });
  let r=Math.random()*tot; for(let i=0;i<keys.length;i++){ r-=ws[i]; if(r<=0) return keys[i]; }
  return 'jab';
}
function say(html){ G && (G.callHtml=html); $('call').innerHTML=html; }
function pop(text,x,y,color,scale){ G.pops.push({text:text,x:x,y:y,c:color||'#fff',s:scale||1,t:0}); }
function sparks(x,y,n,color){ for(let i=0;i<n;i++){ const a=rnd(0,6.28), v=rnd(60,260); G.fx.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,t:0,life:rnd(.2,.5),c:color,r:rnd(1.5,3.5)}); } G.fx.push({ring:1,x:x,y:y,t:0,life:.28,c:color}); }

function resolve(f,o){
  const m=f.mv, d=Math.abs(o.x-f.x);
  if(o.state==='down'||o.state==='getup'||o.state==='ko'||o.inv>0) return;
  if(d>m.reach+6 || d<m.min-14){ if(m.special) say('<b>'+f.name+'</b> ออก'+m.th+'แต่พลาดเป้า'); return; }
  const tgt = m.lvl==='head' ? o.j.hd : m.lvl==='body' ? o.j.ch : o.j.fk;
  let pB=o.stats.def/100*.5, pD=o.stats.spd/100*.12;
  if(o.state==='move'){ pB*=.2; pD=0; } else if(o.state==='hit'){ pB*=.35; pD=0; }
  if(o.st<25) pB*=.7; if(m.special){ pB*=.45; pD*=.4; }
  const r=Math.random();
  if(r<pD && m.lvl!=='leg'){ o.state='block'; o.hold=.22; o.q=[]; setPose(o,'dodge',.07); pop('หลบ!',o.x,FLOOR-170,'#cfd6e6',.8); snd('whiff'); return; }
  if(r<pD+pB){
    const dm=m.dmg*.18; o.hp=Math.max(1,o.hp-dm); f.pts+=dm*.5; o.st=Math.max(0,o.st-2);
    o.state='block'; o.hold=.2; o.q=[]; setPose(o, m.kind==='kick'&&m.lvl!=='head'?'check':'block', .06);
    o.x=clamp(o.x-o.dir*m.push*.4,LEFT,RIGHT); sparks(tgt[0],tgt[1],4,'#cfd6e6'); G.shake=Math.max(G.shake,2); snd('block');
    if(m.special) say('<b>'+o.name+'</b> บัง'+m.th+'ไว้ได้'); return;
  }
  const stat=(m.kind==='punch'?f.stats.pow:f.stats.kick)/100;
  let dm=m.dmg*(.6+.8*stat)*rnd(.85,1.15)*(f.st<25?.8:1);
  const counter=o.state==='move', crit=Math.random()<.1;
  if(counter) dm*=1.3; if(crit) dm*=1.5;
  const raw=dm; dm*=DMG;
  o.hp-=dm; f.pts+=dm; f.sp=Math.min(100,f.sp+dm*1.9); o.sp=Math.min(100,o.sp+dm*1.1); o.st=Math.max(0,o.st-dm*.25);
  o.x=clamp(o.x-o.dir*m.push,LEFT,RIGHT);
  o.q=[]; o.mv=null; o.state='hit'; o.hold=.2+raw/60; setPose(o, m.lvl==='head'?'hitHead':m.lvl==='body'?'hitBody':'hitLeg', .06);
  const big=raw>=13||m.special;
  sparks(tgt[0],tgt[1], big?16:7, big?'#ffd35a':'#ffffff');
  for(let i=0;i<(big?6:2);i++) G.fx.push({x:tgt[0],y:tgt[1],vx:-o.dir*rnd(40,160),vy:rnd(-160,-40),t:0,life:rnd(.3,.6),c:'#bfe6ff',r:rnd(1,2.2),g:1});
  G.stop=Math.max(G.stop,.03+raw/260); G.shake=Math.max(G.shake,3+raw*.5); G.hype=Math.min(1,G.hype+raw/22); snd('hit',raw);
  if(big){ pop(m.th+'!', tgt[0], tgt[1]-34, '#ffd35a', m.special?1.3:1); G.flash=.12; }
  const where=m.lvl==='head'?'เข้าหน้า':m.lvl==='body'?'เข้าลำตัว':'เข้าขา';

function hud(){
  const a=G.f[0], b=G.f[1];
  $('hpR').style.width=a.hp+'%'; $('hpB').style.width=b.hp+'%'; $('stR').style.width=a.st+'%'; $('stB').style.width=b.st+'%'; $('spR').style.width=a.sp+'%'; $('spB').style.width=b.sp+'%';
  $('hpR').style.background=a.hp<30?'#f0624f':a.hp<55?'#f2c23a':''; $('hpB').style.background=b.hp<30?'#f0624f':b.hp<55?'#f2c23a':'';
  $('rd').textContent='ยก '+G.round+'/'+ROUNDS; $('tm').textContent=fmt(G.clock);
  if(G.showResult){ G.showResult=false; const o=G.over;
    $('resM').textContent = o.how==='คะแนน' ? 'ชนะคะแนน ครบ '+ROUNDS+' ยก' : 'ชนะ'+o.how+' ยก '+o.round+' นาทีที่ '+fmt(o.time);
    $('resW').textContent=o.w.name; $('resW').style.color=o.w.side==='r'?'#ff7a70':'#7fb0ff';
    $('resD').textContent = (o.move?'ปิดเกมด้วย'+o.move+' · ':'')+'คะแนนความเสียหาย '+Math.round(G.f[0].pts)+' ต่อ '+Math.round(G.f[1].pts);
    $('result').hidden=false; }
}
function renderCards(){
  [['R',0,'r'],['B',1,'b']].forEach(c=>{ const s=specs[c[1]];
    $('nm'+c[0]).textContent=s.name;
    $('card'+c[0]).innerHTML='<h2>'+s.name+'</h2><div class="sty">สาย'+s.style.th+' · มุม'+(c[2]==='r'?'แดง':'น้ำเงิน')+'</div>'+
      Object.keys(STAT_TH).map(k=>'<div class="stat"><span>'+STAT_TH[k]+'</span><span class="t"><i style="width:'+s.stats[k]+'%"></i></span><span class="v">'+s.stats[k]+'</span></div>').join('')+
      '<div class="spx">ท่าไม้ตาย: '+MOVES[s.style.sp].th+'</div>'; });
}
function frame(ts){
  if(!last) last=ts; let dt=Math.min(.05,(ts-last)/1000); last=ts;
  if(G){
    G.shake*=.86;
    if(G.stop>0){ G.stop-=dt; }
    else {
      let scale=speed; if(G.slow>0){ G.slow-=dt; scale*=.28; }
      let rem=dt*scale; while(rem>0){ const s=Math.min(rem,1/90); update(s); rem-=s; }
    }
    render(ts/1000); hud();
  }
  requestAnimationFrame(frame);
}
$('btnRematch').addEventListener('click',()=>newFight(false));
$('btnNew').addEventListener('click',()=>newFight(true));
$('btnSpeed').addEventListener('click',e=>{ speed=speed===1?2:1; e.currentTarget.setAttribute('aria-pressed',String(speed===2)); });
$('btnSound').addEventListener('click',e=>{ soundOn=!soundOn; if(soundOn){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(err){ soundOn=false; } } e.currentTarget.setAttribute('aria-pressed',String(soundOn)); e.currentTarget.textContent=soundOn?'ปิดเสียง':'เปิดเสียง'; if(soundOn) snd('bell',1); });
window.addEventListener('resize',layout);
/* headless batch for tuning: runs fights without drawing */
window.MT={batch:function(n){ const out={ko:0,tko:0,dec:0,rounds:[0,0,0],kd:0}; for(let i=0;i<n;i++){ newFight(true); let guard=0; while(G.phase!=='over' && guard++<60000){ G.f.forEach(skeleton); update(1/60); } if(!G.over) continue; out[G.over.how==='น็อก'?'ko':G.over.how==='ทีเคโอ'?'tko':'dec']++; out.rounds[G.over.round-1]++; out.kd+=G.f[0].kd+G.f[1].kd; } newFight(true); return out; }};
layout(); newFight(true); requestAnimationFrame(frame);
})();
</script>
