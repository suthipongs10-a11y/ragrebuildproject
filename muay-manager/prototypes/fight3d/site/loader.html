<!-- The website's loading screen (build.mjs puts it in place of the page's scripts). The models, sounds and drawn art
     (a/<hash>.html) and the game code (a/<hash>.js) are separate files named by their content, kept by the browser
     for a year: after an update only the changed file is downloaded again, not the whole 11 MB. -->
<div id="siteLoad" role="status" aria-live="polite">
  <div class="sl-box">
    <b class="sl-logo">MUAY <span>MANAGER</span></b>
    <span id="slMsg">กำลังโหลดเกม…</span>
    <div class="sl-bar"><i id="slBar"></i></div>
    <small id="slNote"></small>
  </div>
</div>
<style>
#siteLoad{position:fixed;inset:0;z-index:100;background:#0e0f14;display:flex;align-items:center;justify-content:center;padding:16px;color:#f1f2f5;font-family:"Bai Jamjuree",system-ui,sans-serif}
#siteLoad .sl-box{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,100%);text-align:center}
#siteLoad .sl-logo{font-family:"Chakra Petch",system-ui,sans-serif;font-style:italic;font-weight:800;font-size:28px;letter-spacing:.02em}
#siteLoad .sl-logo span{color:#f2b83a}
#siteLoad #slMsg{font-size:15px}
#siteLoad .sl-bar{width:100%;height:8px;border-radius:4px;background:#2a2d39;overflow:hidden}
#siteLoad .sl-bar i{display:block;height:100%;width:2%;background:#f2b83a;transition:width .2s}
#siteLoad small{font-size:12.5px;color:#9a9fb0;min-height:1.4em}
#siteLoad button{font:inherit;font-size:15px;padding:10px 18px;border-radius:8px;border:0;background:#f2b83a;color:#1b1300;font-weight:700}
</style>
<script>
  // the loading screen speaks the device's language before the game (and src/i18n.js) arrives
  var LANG = (function () { try { var q = new URLSearchParams(location.search).get('lang'); if (q) return q; var s = localStorage.getItem('muayLang'); if (s) return s; return (navigator.languages || [navigator.language]).some(function (x) { return /^zh/i.test(x || ''); }) ? 'zh' : 'th'; } catch (e) { return 'th'; } })();
  var EN = {'กำลังโหลดเกม…': 'Loading the game…', 'กำลังเตรียมเวที…': 'Setting up the ring…', 'ลองใหม่': 'Try again', 'ล้างการตั้งค่าเสียงและภาพ แล้วลองใหม่': 'Reset sound and picture settings, then try again',
    'โหลดไม่สำเร็จ (เน็ตหลุดหรือช้า)': 'Could not load (connection lost or slow)', 'เกมเริ่มไม่ได้ ส่งรายงานให้ผู้พัฒนาแล้ว': "The game could not start; a report went to the developer", 'เกมเริ่มช้าผิดปกติ': 'The game is unusually slow to start', 'ลองใหม่อีกครั้ง หรือล้างการตั้งค่า': 'Try again, or reset the settings'};
  var ZH = {'กำลังโหลดเกม…': '正在载入游戏…', 'กำลังเตรียมเวที…': '正在准备拳台…', 'ลองใหม่': '重试', 'ล้างการตั้งค่าเสียงและภาพ แล้วลองใหม่': '重置声音和画面设置，然后重试',
    'โหลดไม่สำเร็จ (เน็ตหลุดหรือช้า)': '载入失败（网络断开或太慢）', 'เกมเริ่มไม่ได้ ส่งรายงานให้ผู้พัฒนาแล้ว': '游戏无法启动，已向开发者发送报告', 'เกมเริ่มช้าผิดปกติ': '游戏启动异常缓慢', 'ลองใหม่อีกครั้ง หรือล้างการตั้งค่า': '再试一次，或重置设置'};
  var L = function (th) { var t = {en: EN, zh: ZH}[LANG]; return t && t[th] ? t[th] : th; };
  if (LANG === 'en' || LANG === 'zh') { document.documentElement.lang = LANG; var m0 = document.getElementById('slMsg'); if (m0) m0.textContent = L(m0.textContent); }

(async function () {
  var A = /*__SITE_ASSETS__*/null;
  var bar = document.getElementById('slBar'), msg = document.getElementById('slMsg'), note = document.getElementById('slNote');
  var total = A.assetsSize + A.appSize, got = 0, mb = function (n) { return (n / 1048576).toFixed(1); };
  note.textContent = LANG === 'en' ? 'About ' + mb(A.assetsGz) + ' MB the first time, then only what changed' : LANG === 'zh' ? '第一次约 ' + mb(A.assetsGz) + ' MB，之后只下载有变动的部分' : 'ครั้งแรกราว ' + mb(A.assetsGz) + ' MB ครั้งต่อไปโหลดเฉพาะส่วนที่เปลี่ยน';
  // read a file and move the bar as it arrives (sizes are the unpacked sizes, which is what the reader counts)
  async function pull(url) {
    var r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status);
    if (!r.body || !r.body.getReader) { var t = await r.text(); got += t.length; return t; }
    var rd = r.body.getReader(), dec = new TextDecoder(), out = '';
    for (;;) {
      var c = await rd.read(); if (c.done) break;
      got += c.value.length; out += dec.decode(c.value, {stream: true});
      bar.style.width = Math.min(98, 2 + got / total * 96) + '%';
    }
    return out + dec.decode();
  }
  // errors on players' phones go to the server (/api/log) so they can be read while fixing; a few per visit at most
  var sent = 0, failed = null, booted = function () { var h = document.querySelector('h1'); return !!(h && h.classList.contains('glogo')); };
  function report(m) {
    if (!failed && !booted()) failed = m;
    if (sent++ >= 5) return;
    var ver = (document.getElementById('ver') || {}).textContent || '';
    try { navigator.sendBeacon('/api/log', JSON.stringify({msg: String(m).slice(0, 3000), ver: ver})); } catch (e) { /* no beacon */ }
  }
  window.addEventListener('error', function (e) { report((e.message || 'error') + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno + (e.error && e.error.stack ? '\n' + e.error.stack : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; report('promise: ' + (r && (r.stack || r.message) || r)); });
  function fail(text, detail) {
    msg.textContent = text; note.textContent = String(detail || '').slice(0, 160); bar.parentNode.style.display = 'none';
    var row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center';
    var b = document.createElement('button'); b.textContent = L('ลองใหม่'); b.onclick = function () { location.reload(); }; row.appendChild(b);
    var c = document.createElement('button'); c.textContent = L('ล้างการตั้งค่าเสียงและภาพ แล้วลองใหม่'); c.style.background = '#2a2d39'; c.style.color = '#f1f2f5';
    c.onclick = function () { try { localStorage.removeItem('muaySound'); } catch (e) {} location.reload(); }; row.appendChild(c);
    msg.parentNode.appendChild(row);
  }
  // Once a day per browser: how bright the drawn picture is and what lies over the 3D view, sent to /api/log, so a
  // look that differs between browsers can be checked without the device.
  function diag() {
    try {
      var day = new Date().toISOString().slice(0, 10); if (localStorage.getItem('muayDiag') === day) return; localStorage.setItem('muayDiag', day);
      var L = window.LAB, r = L && L.three && L.three.renderer, gl = r && r.getContext(), cv = document.getElementById('cv');
      var lum = -1;
      if (gl) {
        r.render(L.three.scene, L.three.camera); // read the frame just drawn, before the page shows it
        var w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(w * h * 4), sum = 0, n = 0;
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
        for (var i = 0; i < px.length; i += 4 * 97) { sum += .2126 * px[i] + .7152 * px[i + 1] + .0722 * px[i + 2]; n++; }
        lum = Math.round(sum / n);
      }
      var b = cv.getBoundingClientRect(), over = document.elementsFromPoint(b.left + b.width / 2, b.top + b.height / 2).slice(0, 5).map(function (e) { return e.id || e.className || e.tagName; });
      var dbg = gl && gl.getExtension('WEBGL_debug_renderer_info'), gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '';
      var st = function (id) { var e = document.getElementById(id); return e ? getComputedStyle(e).display + '/' + getComputedStyle(e).opacity : '-'; };
      report('diag lum=' + lum + ' exp=' + (r && r.toneMappingExposure.toFixed(2)) + ' over=' + over.join('>') + ' result=' + st('result') + ' flash=' + st('flash') +
        ' before=' + getComputedStyle(document.querySelector('.app'), '::before').zIndex + ' gpu=' + gpu + ' dpr=' + devicePixelRatio + ' buf=' + (gl && gl.drawingBufferWidth + 'x' + gl.drawingBufferHeight) + ' css=' + Math.round(b.width) + 'x' + Math.round(b.height) + ' settings=' + localStorage.getItem('muaySound'));
    } catch (e) { report('diag failed: ' + e.message); }
  }
  function script(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { no(new Error(src)); }; document.head.appendChild(s); }); }
  try {
    var both = await Promise.all([pull(A.assets), pull(A.app), script(A.three)]);
    msg.textContent = L('กำลังเตรียมเวที…'); bar.style.width = '99%';
    await new Promise(function (ok) { setTimeout(ok, 30); });
    var box = document.createElement('div'); box.id = 'siteAssets'; box.hidden = true; box.innerHTML = both[0]; document.body.appendChild(box);
    var s = document.createElement('script'); s.textContent = both[1]; document.body.appendChild(s);
  } catch (e) { report('load: ' + (e && e.message || e)); fail(L('โหลดไม่สำเร็จ (เน็ตหลุดหรือช้า)'), e && e.message || e); return; }
  // the game is up when its menu has replaced the page title; an error before that shows here instead of a frozen page
  for (var i = 0; i < 150; i++) {
    if (booted()) { document.getElementById('siteLoad').remove(); setTimeout(diag, 5000); return; }
    if (failed) { fail(L('เกมเริ่มไม่ได้ ส่งรายงานให้ผู้พัฒนาแล้ว'), failed); return; }
    await new Promise(function (ok) { setTimeout(ok, 200); });
  }
  report('boot: no game menu after 30 s'); fail(L('เกมเริ่มช้าผิดปกติ'), L('ลองใหม่อีกครั้ง หรือล้างการตั้งค่า'));
})();
</script>
