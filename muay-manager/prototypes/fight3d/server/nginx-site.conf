# nginx site for the game. Copy to /etc/nginx/sites-available/muay-manager, change server_name, link it into
# sites-enabled, then:  sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d muay.example.com
# The game needs HTTPS: a phone will not install it to the home screen, nor keep its sound settings, without it.
server {
    listen 80;
    listen [::]:80;
    server_name muay.example.com;

    client_max_body_size 512k;          # the largest thing a player sends is his save

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering on;             # the big page is read from the game's server once, then sent at the phone's pace
        proxy_max_temp_file_size 64m;
    }
}
